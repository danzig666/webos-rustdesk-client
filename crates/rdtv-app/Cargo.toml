[package]
name = "rdtv-app"
description = "RemoteDesk TV: RustDesk-compatible remote desktop client for LG webOS TVs"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "remotedesk-tv"
path = "src/main.rs"

[dependencies]
rdtv-core = { path = "../rdtv-core" }
rdtv-media = { path = "../rdtv-media" }
log.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sdl2 = { version = "0.37", default-features = false }
fontdue = "0.9"

[build-dependencies]
cc = "1.2"
